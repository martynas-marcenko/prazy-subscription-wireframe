<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIREFRAME: subscription picker, option F (not final design)</title>
<link rel="stylesheet" href="picker.css">
</head>
<body data-variant="f">
<div class="banner"><b>WIREFRAME</b> · shows how the subscription works, not how it will look · not final design</div>
<header class="hdr"><div class="wrap"><div class="box logo">Logo</div><span class="cart">Cart (0)</span></div></header>
<div class="steps"><span class="on"><i>1</i>Pick your sets</span><span><i>2</i>Pick your plan</span><span><i>3</i>Checkout</span></div>
<section>
  <div class="picker"><div class="wrap" id="picker"></div></div>
  <div class="wrap">
    <div class="intro"><h1>Pick your designs</h1></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="bar"><div class="wrap"><div class="tot" id="tot"></div><button class="btn" type="button" id="next">Next</button></div></div>
</section>
<script src="picker.js"></script>
</body>
</html>
